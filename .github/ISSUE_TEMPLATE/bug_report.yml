name: Relatar problema
description: Informe uma falha no funcionamento do kit.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu?
      description: Descreva o comportamento esperado e o observado. Não inclua dados pessoais ou senhas.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Comando ou solicitação ao agente
      description: Informe o comando executado e a mensagem de erro, ocultando informações sensíveis.
      render: shell
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Ambiente
      description: Sistema operacional, arquitetura, versão do Python, forma de inicialização e navegador.
      placeholder: Windows 11, Python 3.12, engine.py com Chrome
    validations:
      required: true
